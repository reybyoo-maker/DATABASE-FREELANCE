name: DATABASE-FREELANCE Daily Prospect Discovery

on:
  schedule:
    # UTC times = 07:10, 13:10, 19:10 and 01:10 the next day in Jakarta.
    - cron: "10 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospect-harvester
  cancel-in-progress: false

jobs:
  discover-analyze-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check required configuration
        id: config
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          if [[ -z "$TAVILY_API_KEY" || -z "$GEMINI_API_KEY" || -z "$SHEET_WEBHOOK_URL" || -z "$WEBHOOK_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Automation is not configured yet. Add TAVILY_API_KEY, GEMINI_API_KEY, SHEET_WEBHOOK_URL and WEBHOOK_TOKEN in repository Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax
        if: steps.config.outputs.ready == 'true'
        run: python -m py_compile src/runner.py

      - name: Discover, audit, and write prospects
        if: steps.config.outputs.ready == 'true'
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          DAILY_TARGET: ${{ vars.DAILY_TARGET || '100' }}
          PYTHONUNBUFFERED: "1"
        run: python src/runner.py
